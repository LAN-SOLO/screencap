[package]
name = "screencap-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "screencap core: screenshot library index (search, tags, favorites)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
